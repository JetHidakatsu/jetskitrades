[pytest]
testpaths = env/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test collection and execution
addopts = 
    --verbose
    --tb=short
    --strict-markers
    -ra
    --durations=10
    --maxfail=1
    --cov=env
    --cov-report=term-missing
    --cov-report=html
    --asyncio-mode=auto

# Markers
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    backtest: marks tests related to backtesting functionality
    trading: marks tests related to trading functionality
    async_test: marks tests that require async testing

# Logging
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv env

# Timeout settings
timeout = 300

# Environment variables
env =
    D:PYTHONPATH=.
    D:TESTING=true

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    error::RuntimeWarning
