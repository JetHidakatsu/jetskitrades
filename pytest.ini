[pytest]
# Test discovery patterns
testpaths = env/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
addopts =
    --verbose
    --color=yes
    --durations=10
    --maxfail=2
    --cov=env
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --no-cov-on-fail
    --strict-markers
    --tb=short

# Coverage configuration
[coverage:run]
branch = True
source = env
omit =
    */tests/*
    */__init__.py
    */migrations/*
    */config/*
    env/tests/*
    env/types/*
    env/**/test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError:
    if TYPE_CHECKING:

# Logging configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    quantum: marks tests that use quantum computing features
    trading: marks tests related to trading functionality
    websocket: marks tests related to websocket functionality
    solana: marks tests that interact with Solana
    raydium: marks tests that interact with Raydium
    sentiment: marks tests related to sentiment analysis
    liquidity: marks tests related to liquidity analysis

# Environment variables
env =
    D:PYTHONPATH=env
    D:ENVIRONMENT=test
    D:LOG_LEVEL=DEBUG

# Temporary directory settings
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# Test selection options
norecursedirs = 
    *.egg
    .git
    .tox
    .env
    .venv
    dist
    build
    node_modules

# Custom pytest settings
console_output_style = progress
faulthandler_timeout = 60
xfail_strict = True
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    error::RuntimeWarning

# Timeout settings (in seconds)
timeout = 300
timeout_method = thread

# Parallel execution settings
addopts = 
    -n auto
    --dist loadfile
    --tx 3*popen//python=python3.8

# Hypothesis settings for property-based testing
[tool:hypothesis]
deadline = 500
max_examples = 100
derandomize = True

# Custom test settings
[test]
python_files = test_*.py
python_classes = Test
python_functions = test_*
testpaths = env/tests
