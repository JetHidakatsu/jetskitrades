repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        additional_dependencies:
          - prettier@3.0.0
          - '@trivago/prettier-plugin-sort-imports'

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.47.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.47.0
          - '@typescript-eslint/parser@6.4.0'
          - '@typescript-eslint/eslint-plugin@6.4.0'
          - eslint-config-prettier@9.0.0
          - eslint-plugin-jest@27.2.3
          - eslint-plugin-prettier@5.0.0

  - repo: https://github.com/pre-commit/mirrors-typescript
    rev: v5.1.6
    hooks:
      - id: typescript
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - typescript@5.1.6

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-ll, -r, env]
        files: \.py$

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=100]
        files: \.py$

  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        args: [--line-length=100]
        files: \.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        files: \.py$

  - repo: local
    hooks:
      - id: jest
        name: Run Jest tests
        entry: npm run test
        language: node
        pass_filenames: false
        types: [javascript, jsx, ts, tsx]

      - id: pytest
        name: Run Python tests
        entry: pytest
        language: python
        pass_filenames: false
        types: [python]

      - id: check-env
        name: Check environment variables
        entry: python -c "import os; assert '.env' in os.listdir('env'), '.env file missing'"
        language: python
        pass_filenames: false

      - id: check-keypair
        name: Check Solana keypair
        entry: python -c "import os; assert '.keypair' in os.listdir('env'), 'Solana keypair missing'"
        language: python
        pass_filenames: false

default_language_version:
  python: python3.8
  node: 16.0.0
